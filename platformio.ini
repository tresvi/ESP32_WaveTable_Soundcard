; Ver docs/04-firmware-primera-version.md para el porque de cada eleccion
; (framework, pinout, partition scheme, etc).

[env:esp32dev]
platform = espressif32 @ 6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; notes_data.h son ~1.54 MB de datos en flash (.rodata). El partition table
; por defecto de Arduino/PlatformIO reserva ~1.31 MB por slot de OTA, lo que
; no alcanza. huge_app.csv da un unico partition de ~3 MB (sin OTA), de sobra
; para esta etapa de debug.
board_build.partitions = huge_app.csv
board_build.flash_size = 4MB

; tools/notes_data.h es la fuente autogenerada (ver tools/generate_samples.py).
; Se referencia directo desde ahi en vez de duplicarla dentro de src/.
build_flags =
    -I tools
